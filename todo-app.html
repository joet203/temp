<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Modern Todo & Calendar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 0.6s;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .subtitle {
            color: #666;
            font-size: 0.9rem;
            letter-spacing: 2px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
            animation: slideUp 0.6s;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.3rem;
            color: #00ff88;
            font-weight: 700;
        }

        .add-task-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"],
        input[type="date"],
        select {
            flex: 1;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.05);
        }

        select option {
            background: #1a1a1a;
            color: #fff;
        }

        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 20px;
            color: #888;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
        }

        .filter-tab.active {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border-color: #00ff88;
        }

        .todo-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .todo-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
            animation: fadeIn 0.3s;
        }

        .todo-item:hover {
            border-color: rgba(0, 255, 136, 0.3);
            transform: translateX(5px);
        }

        .todo-item.completed {
            opacity: 0.5;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #00ff88;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .checkbox.checked {
            background: #00ff88;
            position: relative;
        }

        .checkbox.checked::after {
            content: '✓';
            position: absolute;
            top: -2px;
            left: 3px;
            color: #000;
            font-weight: bold;
            font-size: 14px;
        }

        .todo-content {
            flex: 1;
        }

        .todo-text {
            color: #fff;
            font-size: 0.95rem;
            margin-bottom: 5px;
        }

        .todo-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .badge.high { background: rgba(255, 68, 68, 0.2); color: #ff4444; }
        .badge.medium { background: rgba(255, 165, 0, 0.2); color: #ffa500; }
        .badge.low { background: rgba(100, 200, 255, 0.2); color: #64c8ff; }
        .badge.category { background: rgba(0, 255, 136, 0.2); color: #00ff88; }
        .badge.date { background: rgba(100, 100, 100, 0.2); color: #999; }

        .delete-btn {
            padding: 6px 12px;
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid rgba(255, 68, 68, 0.3);
            border-radius: 6px;
            color: #ff4444;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s;
        }

        .delete-btn:hover {
            background: rgba(255, 68, 68, 0.3);
        }

        /* Calendar */
        .calendar {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-title {
            font-size: 1.2rem;
            color: #00d4ff;
            font-weight: 700;
        }

        .calendar-nav {
            display: flex;
            gap: 10px;
        }

        .calendar-nav button {
            padding: 8px 12px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 6px;
            color: #00d4ff;
            cursor: pointer;
            transition: all 0.3s;
        }

        .calendar-nav button:hover {
            background: rgba(0, 212, 255, 0.2);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .calendar-day-header {
            text-align: center;
            color: #666;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 8px;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .calendar-day:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.3);
        }

        .calendar-day.today {
            background: rgba(0, 212, 255, 0.2);
            border-color: #00d4ff;
        }

        .calendar-day.selected {
            background: rgba(0, 255, 136, 0.2);
            border-color: #00ff88;
        }

        .calendar-day.has-tasks::after {
            content: '';
            position: absolute;
            bottom: 5px;
            width: 4px;
            height: 4px;
            background: #00ff88;
            border-radius: 50%;
        }

        .calendar-day-number {
            font-size: 0.85rem;
            color: #fff;
        }

        .calendar-day.other-month {
            opacity: 0.3;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            color: #666;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8rem;
            }

            .add-task-form {
                flex-direction: column;
            }

            .calendar-day-number {
                font-size: 0.75rem;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 136, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 136, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>TaskFlow</h1>
            <p class="subtitle">ORGANIZE YOUR LIFE</p>
        </header>

        <div class="main-grid">
            <!-- Todo List -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Tasks</h2>
                </div>

                <div class="add-task-form">
                    <input type="text" id="taskInput" placeholder="What needs to be done?" />
                    <input type="date" id="taskDate" />
                    <select id="taskPriority">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                    <select id="taskCategory">
                        <option value="personal">Personal</option>
                        <option value="work">Work</option>
                        <option value="shopping">Shopping</option>
                        <option value="health">Health</option>
                        <option value="other">Other</option>
                    </select>
                    <button class="btn" onclick="addTask()">Add</button>
                </div>

                <div class="filter-tabs">
                    <div class="filter-tab active" onclick="filterTasks('all')">All</div>
                    <div class="filter-tab" onclick="filterTasks('active')">Active</div>
                    <div class="filter-tab" onclick="filterTasks('completed')">Completed</div>
                    <div class="filter-tab" onclick="filterTasks('today')">Today</div>
                    <div class="filter-tab" onclick="filterTasks('week')">This Week</div>
                </div>

                <div class="todo-list" id="todoList"></div>
            </div>

            <!-- Calendar & Stats -->
            <div>
                <div class="calendar">
                    <div class="calendar-header">
                        <h3 class="calendar-title" id="calendarTitle">November 2024</h3>
                        <div class="calendar-nav">
                            <button onclick="previousMonth()">←</button>
                            <button onclick="nextMonth()">→</button>
                        </div>
                    </div>
                    <div class="calendar-grid" id="calendarGrid"></div>
                </div>

                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-number" id="totalTasks">0</div>
                        <div class="stat-label">Total Tasks</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="completedTasks">0</div>
                        <div class="stat-label">Completed</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="activeTasks">0</div>
                        <div class="stat-label">Active</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let currentFilter = 'all';
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();

        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
            renderTasks();
            updateStats();
            renderCalendar();
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const date = document.getElementById('taskDate');
            const priority = document.getElementById('taskPriority');
            const category = document.getElementById('taskCategory');

            if (!input.value.trim()) return;

            const task = {
                id: Date.now(),
                text: input.value,
                completed: false,
                date: date.value,
                priority: priority.value,
                category: category.value,
                createdAt: new Date().toISOString()
            };

            tasks.push(task);
            saveTasks();

            input.value = '';
            date.value = '';
            priority.value = 'medium';
            category.value = 'personal';
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
        }

        function filterTasks(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            renderTasks();
        }

        function getFilteredTasks() {
            const today = new Date().toISOString().split('T')[0];
            const weekLater = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];

            switch(currentFilter) {
                case 'active':
                    return tasks.filter(t => !t.completed);
                case 'completed':
                    return tasks.filter(t => t.completed);
                case 'today':
                    return tasks.filter(t => t.date === today);
                case 'week':
                    return tasks.filter(t => t.date >= today && t.date <= weekLater);
                default:
                    return tasks;
            }
        }

        function renderTasks() {
            const list = document.getElementById('todoList');
            const filteredTasks = getFilteredTasks();

            list.innerHTML = filteredTasks.map(task => `
                <div class="todo-item ${task.completed ? 'completed' : ''}">
                    <div class="checkbox ${task.completed ? 'checked' : ''}" onclick="toggleTask(${task.id})"></div>
                    <div class="todo-content">
                        <div class="todo-text">${task.text}</div>
                        <div class="todo-meta">
                            <span class="badge ${task.priority}">${task.priority.toUpperCase()}</span>
                            <span class="badge category">${task.category}</span>
                            ${task.date ? `<span class="badge date">📅 ${task.date}</span>` : ''}
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteTask(${task.id})">Delete</button>
                </div>
            `).join('');
        }

        function updateStats() {
            document.getElementById('totalTasks').textContent = tasks.length;
            document.getElementById('completedTasks').textContent = tasks.filter(t => t.completed).length;
            document.getElementById('activeTasks').textContent = tasks.filter(t => !t.completed).length;
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const firstDay = new Date(currentYear, currentMonth, 1);
            const lastDay = new Date(currentYear, currentMonth + 1, 0);
            const prevLastDay = new Date(currentYear, currentMonth, 0);
            const startDay = firstDay.getDay();
            const totalDays = lastDay.getDate();
            const today = new Date();

            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                              'July', 'August', 'September', 'October', 'November', 'December'];

            document.getElementById('calendarTitle').textContent = `${monthNames[currentMonth]} ${currentYear}`;

            let html = '';

            // Day headers
            ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(day => {
                html += `<div class="calendar-day-header">${day}</div>`;
            });

            // Previous month days
            for (let i = startDay - 1; i >= 0; i--) {
                const day = prevLastDay.getDate() - i;
                html += `<div class="calendar-day other-month"><span class="calendar-day-number">${day}</span></div>`;
            }

            // Current month days
            for (let day = 1; day <= totalDays; day++) {
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const hasTasks = tasks.some(t => t.date === dateStr);
                const isToday = today.getDate() === day && today.getMonth() === currentMonth && today.getFullYear() === currentYear;

                html += `
                    <div class="calendar-day ${isToday ? 'today' : ''} ${hasTasks ? 'has-tasks' : ''}">
                        <span class="calendar-day-number">${day}</span>
                    </div>
                `;
            }

            // Next month days
            const remainingDays = 42 - (startDay + totalDays);
            for (let day = 1; day <= remainingDays; day++) {
                html += `<div class="calendar-day other-month"><span class="calendar-day-number">${day}</span></div>`;
            }

            grid.innerHTML = html;
        }

        function previousMonth() {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        function nextMonth() {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            renderCalendar();
        }

        // Enter key to add task
        document.getElementById('taskInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        // Initialize
        renderTasks();
        updateStats();
        renderCalendar();
    </script>
</body>
</html>
