<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Environment Info</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 50%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }

        .subtitle {
            color: #888;
            font-size: 1rem;
            letter-spacing: 2px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            animation: fadeInUp 0.8s ease-out;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .card:hover::before {
            left: 100%;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 212, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
        }

        .card-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #00d4ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon {
            font-size: 1.5rem;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #888;
            font-size: 0.9rem;
        }

        .info-value {
            color: #fff;
            font-weight: 600;
            text-align: right;
            max-width: 60%;
            overflow-wrap: break-word;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: #00d4ff;
        }

        .spinner {
            border: 3px solid rgba(0, 212, 255, 0.1);
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        .network-list {
            margin-top: 10px;
        }

        .network-item {
            background: rgba(0, 212, 255, 0.05);
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            border-left: 3px solid #00d4ff;
        }

        .network-name {
            color: #00ff88;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .network-detail {
            font-size: 0.85rem;
            color: #aaa;
            margin-left: 10px;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
            animation: pulse 2s infinite;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            border: none;
            color: #0f0f1e;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.3);
            font-size: 1rem;
        }

        .refresh-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.5);
        }

        .refresh-btn:active {
            transform: scale(0.95);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .refresh-btn {
                bottom: 20px;
                right: 20px;
                padding: 12px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>System Environment Dashboard</h1>
            <p class="subtitle">REAL-TIME MONITORING</p>
        </header>

        <div id="client-info" class="grid">
            <div class="card">
                <h2 class="card-title">
                    <span class="icon">=»</span>
                    Client Information
                    <span class="status-indicator"></span>
                </h2>
                <div id="client-content" class="loading">
                    <div class="spinner"></div>
                    Loading client data...
                </div>
            </div>
        </div>

        <div id="server-info" class="grid">
            <div class="card">
                <h2 class="card-title">
                    <span class="icon">=¥</span>
                    Server Information
                    <span class="status-indicator"></span>
                </h2>
                <div id="server-content" class="loading">
                    <div class="spinner"></div>
                    Loading server data...
                </div>
            </div>
        </div>

        <button class="refresh-btn" onclick="loadAllInfo()">» Refresh Data</button>
    </div>

    <script>
        // Client Information Gathering
        function getClientInfo() {
            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;

            return {
                browser: {
                    name: getBrowserName(),
                    version: navigator.appVersion,
                    userAgent: navigator.userAgent,
                    language: navigator.language,
                    languages: navigator.languages.join(', '),
                    cookiesEnabled: navigator.cookieEnabled,
                    onLine: navigator.onLine
                },
                screen: {
                    resolution: `${screen.width} x ${screen.height}`,
                    availableResolution: `${screen.availWidth} x ${screen.availHeight}`,
                    colorDepth: `${screen.colorDepth}-bit`,
                    pixelRatio: window.devicePixelRatio
                },
                viewport: {
                    width: window.innerWidth,
                    height: window.innerHeight
                },
                performance: {
                    memory: navigator.deviceMemory ? `${navigator.deviceMemory} GB` : 'N/A',
                    hardwareConcurrency: navigator.hardwareConcurrency || 'N/A',
                    connectionType: connection ? connection.effectiveType : 'N/A',
                    downlink: connection ? `${connection.downlink} Mbps` : 'N/A'
                },
                platform: {
                    os: navigator.platform,
                    vendor: navigator.vendor,
                    maxTouchPoints: navigator.maxTouchPoints
                },
                time: {
                    localTime: new Date().toLocaleString(),
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    timezoneOffset: new Date().getTimezoneOffset()
                }
            };
        }

        function getBrowserName() {
            const ua = navigator.userAgent;
            if (ua.includes('Firefox')) return 'Firefox';
            if (ua.includes('Edg')) return 'Edge';
            if (ua.includes('Chrome')) return 'Chrome';
            if (ua.includes('Safari')) return 'Safari';
            if (ua.includes('Opera')) return 'Opera';
            return 'Unknown';
        }

        // Display Client Information
        function displayClientInfo() {
            const info = getClientInfo();
            const content = document.getElementById('client-content');

            content.innerHTML = `
                <div class="info-section">
                    <div class="info-row">
                        <span class="info-label">Browser</span>
                        <span class="info-value">${info.browser.name}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Language</span>
                        <span class="info-value">${info.browser.language}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Online Status</span>
                        <span class="info-value">${info.browser.onLine ? ' Online' : ' Offline'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Screen Resolution</span>
                        <span class="info-value">${info.screen.resolution}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Viewport Size</span>
                        <span class="info-value">${info.viewport.width} x ${info.viewport.height}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Color Depth</span>
                        <span class="info-value">${info.screen.colorDepth}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Pixel Ratio</span>
                        <span class="info-value">${info.screen.pixelRatio}x</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">CPU Cores</span>
                        <span class="info-value">${info.performance.hardwareConcurrency}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Device Memory</span>
                        <span class="info-value">${info.performance.memory}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Connection Type</span>
                        <span class="info-value">${info.performance.connectionType}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Platform</span>
                        <span class="info-value">${info.platform.os}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Local Time</span>
                        <span class="info-value">${info.time.localTime}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Timezone</span>
                        <span class="info-value">${info.time.timezone}</span>
                    </div>
                </div>
            `;
        }

        // Fetch and Display Server Information
        async function displayServerInfo() {
            const content = document.getElementById('server-content');

            try {
                const response = await fetch('/api/server-info');
                const info = await response.json();

                let networkHTML = '';
                for (const [name, addrs] of Object.entries(info.networkInterfaces)) {
                    if (addrs.length > 0) {
                        networkHTML += `
                            <div class="network-item">
                                <div class="network-name">${name}</div>
                                ${addrs.map(addr => `
                                    <div class="network-detail">${addr.family}: ${addr.address}</div>
                                `).join('')}
                            </div>
                        `;
                    }
                }

                content.innerHTML = `
                    <div class="info-section">
                        <div class="info-row">
                            <span class="info-label">Hostname</span>
                            <span class="info-value">${info.hostname}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Platform</span>
                            <span class="info-value">${info.platform} (${info.architecture})</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">CPU Model</span>
                            <span class="info-value">${info.cpuModel}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">CPU Cores</span>
                            <span class="info-value">${info.cpus}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Total Memory</span>
                            <span class="info-value">${info.totalMemory}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Free Memory</span>
                            <span class="info-value">${info.freeMemory}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">System Uptime</span>
                            <span class="info-value">${info.uptime}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Load Average</span>
                            <span class="info-value">${info.loadAverage.join(', ')}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Node Version</span>
                            <span class="info-value">${info.nodeVersion}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Server Time</span>
                            <span class="info-value">${new Date(info.serverTime).toLocaleString()}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Timezone</span>
                            <span class="info-value">${info.timezone}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Environment</span>
                            <span class="info-value">${info.env.nodeEnv}</span>
                        </div>
                    </div>
                    ${networkHTML ? `<div class="network-list"><h3 style="color: #00d4ff; margin: 15px 0 10px 0; font-size: 1rem;">Network Interfaces</h3>${networkHTML}</div>` : ''}
                `;
            } catch (error) {
                content.innerHTML = `
                    <div style="color: #ff4444; text-align: center; padding: 20px;">
                          Failed to load server information
                        <br><small>${error.message}</small>
                    </div>
                `;
            }
        }

        // Load all information
        function loadAllInfo() {
            displayClientInfo();
            displayServerInfo();
        }

        // Initialize on page load
        window.addEventListener('load', loadAllInfo);

        // Update viewport info on resize
        window.addEventListener('resize', displayClientInfo);
    </script>
</body>
</html>
